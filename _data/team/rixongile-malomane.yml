description: >
  Rixongile is an epidemiologist working with the Wastewater Genomics Syndicate (WGS) at the Centre for Vaccines and Immunology (CVI) at the National Institute for Communicable Diseases (NICD), to monitor pathogens in communities using wastewater surveillance. Rixongile holds a Master of Science (MSc) in Epidemiology and Biostatistics as well as an MPhil in Forensic Science and an Hons in Medical Science. Her work focuses on transforming complex surveillance data into evidence that supports disease detection, outbreak response, and public-health decision-making. She is currently working on integrating clinical, wastewater, and genomic surveillance measles data to understand disease transmission better



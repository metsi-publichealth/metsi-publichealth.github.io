description: >
  Dr Cari van Schalkwyk is the Head of Modelling at the South African Centre for Epidemiological Modelling and Analysis (SACEMA), Stellenbosch University. She is a mathematical epidemiologist whose research focuses on developing and applying quantitative methods to understand infectious disease dynamics and inform public health decision-making. Her work spans HIV, tuberculosis, SARS-CoV-2, polio, measles and other vaccine-preventable diseases, with particular expertise in integrating epidemiological and surveillance data with mathematical models. She is the director of the International Clinics on Infectious Disease Dynamics and Data (ICI3D), through which she contributes to strengthening infectious disease modelling capacity across Africa. Within the METSI consortium, her work focuses on linking wastewater surveillance data with epidemiological models and other surveillance streams to improve the interpretation and public health use of wastewater signals.

description: >
  Professor Sheetal Silal is an internationally recognised leader in the field of infectious disease modelling, with a particular focus on vector-borne and vaccine-preventable diseases and pandemic preparedness in Africa and globally. She is Director of the Modelling and Simulation Hub, Africa (MASHA) at the University of Cape Town and an Honorary Visiting Research Fellow in Tropical Disease Modelling at Oxford University. Her research focuses on developing and applying mathematical transmission models to understand disease dynamics, assess public health interventions, and support evidence-based decision-making. Her work spans African and global contexts, with a strong emphasis on translating complex modelling outputs into actionable insights for public health decision-making. She chairs the World Health Organization’s Immunization and Vaccines-related Implementation Research Advisory Committee and is a Gates Foundation Calestous Juma Science Leadership Fellow. Through these roles, she contributes to global immunization strategy and advances the use of modelling to inform health system planning, endemic disease control, and pandemic preparedness efforts. Professor Silal is deeply committed to building capacity in Africa through training the next generation of African modellers, fostering interdisciplinary collaboration, and strengthening networks across the continent ensuring that African countries are equipped to respond to both endemic diseases and emerging public health threats


  
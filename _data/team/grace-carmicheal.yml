description: >
  Grace is a researcher at the Modelling and Simulation Hub, Africa (MASHA). She holds a Master's in Biostatistics and is a PhD candidate at the University of Cape Town (UCT). Her work focuses on the application of statistical and mathematical models to solve public health problems, with a particular focus on epidemic and pandemic preparedness and response in Africa. For this project, Grace is investigating the association between wastewater positivity and clinical cases of measles in South Africa and determining at what spatial proximity this association is detectable


  
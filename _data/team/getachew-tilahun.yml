description: >
  Getachew is a Research Officer at the Modelling and Simulation Hub, Africa (MASHA). He holds a PhD in Infectious Disease Modelling and has extensive experience in the development and application of mathematical and computational models to understand infectious disease transmission and inform public health research. For this project, Getachew is investigating the transmission dynamics of Hepatitis A using multiple complementary data sources, including SAMS serological data, routine testing data, and wastewater surveillance data. His work focuses on estimating age-specific force of infection and understanding the patterns of Hepatitis A transmission across different age groups. By integrating serological and surveillance data within a mathematical modelling framework, he aims to estimate the symptomatic fraction of infection and assess the level of endemicity in the study population. The analysis will provide a more comprehensive understanding of the epidemiology of Hepatitis A and help identify differences in infection risk across age groups. The integration of multiple data sources will also enable comparison between estimated infection incidence and routinely reported symptomatic cases, providing insights into potential under-ascertainment of Hepatitis A infections. This project will try to combine mathematical modelling, epidemiological analysis, and data integration to generate evidence on Hepatitis A transmission and endemicity.
description: >
  Jeremy Bingham is a junior researcher and PhD student at the South African Centre for Epidemiological Modelling and Analysis (SACEMA), Stellenbosch University. Jeremy also serves as the technical lead for the SACEMA Policy Modelling Fellowship, and as a modeller for several technical working groups providing information support to vaccination policy makers. His research focuses on population risk and surveillance for measles and polio.
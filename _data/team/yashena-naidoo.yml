description: >
  Yashena Naidoo is a Junior Researcher at the Gauteng City-Region Observatory and a PhD Fellow in the Wits-Edinburgh Sustainable African Futures Doctoral Programme. She holds Master's degrees in Geoinformatics (with distinction, University of Pretoria) and Sustainable African Futures (University of Edinburgh), and specialises in spatial data science, GIS, remote sensing and machine learning to understand socio-economic dynamics and urban change. Within this project, Yashena brings strong data curation skills, GIS expertise applied to public health contexts, and an ability to communicate complex spatial analysis to non-specialist audiences. 